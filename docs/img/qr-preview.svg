    <path d="M402 192 h26 v26 h-26 z M409 199 v12 h12 v-12 z" fill-rule="evenodd"/>
    <rect x="340" y="93" width="7" height="7"/><rect x="354" y="93" width="7" height="7"/>
    <rect x="340" y="107" width="7" height="7"/><rect x="361" y="107" width="7" height="7"/>
    <rect x="375" y="121" width="7" height="7"/><rect x="347" y="135" width="7" height="7"/>
    <rect x="368" y="142" width="7" height="7"/><rect x="382" y="135" width="7" height="7"/>
    <rect x="326" y="156" width="7" height="7"/><rect x="347" y="163" width="7" height="7"/>
    <rect x="361" y="170" width="7" height="7"/><rect x="389" y="163" width="7" height="7"/>
    <rect x="312" y="121" width="7" height="7"/><rect x="305" y="149" width="7" height="7"/>
    <rect x="340" y="219" width="7" height="7"/><rect x="354" y="212" width="7" height="7"/>
    <rect x="368" y="219" width="7" height="7"/><rect x="389" y="212" width="7" height="7"/>
    <rect x="416" y="135" width="7" height="7"/><rect x="409" y="156" width="7" height="7"/>
    <rect x="312" y="228" width="7" height="7"/><rect x="333" y="235" width="7" height="7"/>
    <rect x="402" y="233" width="7" height="7"/><rect x="423" y="228" width="7" height="7"/>
  </g>
  <!-- source text -->
  <text x="360" y="278" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#333340">WIFI:T:WPA;S:RFK90;P:••••••;;</text>
  <text x="360" y="302" text-anchor="middle" font-size="12" fill="#8A8A93">Esc 或点击窗外关闭</text>
  <!-- captions -->
  <text x="16" y="452" font-size="13" fill="#8A8A93">Ctrl+Enter 打开置顶预览窗：二维码与原文并排可读，深色主题下窗口仍是浅色，保证扫码对比度。</text>
  <text x="16" y="472" font-size="13" fill="#8A8A93">Enter 复制图片到剪贴板，Shift+Enter 存入「图片」文件夹（qr-日期-时间.png，重名自动 +1）。</text>
</svg>
