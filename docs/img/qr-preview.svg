<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif">
  <defs>
    <filter id="pshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- launcher window behind, dimmed -->
  <rect x="90" y="386" width="540" height="46" rx="16" fill="#26262E" stroke="#3A3A44" opacity="0.9"/>
  <rect x="110" y="394" width="500" height="28" rx="9" fill="#1C1C22" opacity="0.9"/>
  <text x="130" y="413" font-size="13" fill="#6E6E7A">qrwifi RFK90 …</text>
  <!-- preview window: always light, always on top -->
  <rect x="248" y="34" width="224" height="344" rx="14" fill="#F5F5F7" stroke="#D8D8DE" filter="url(#pshadow)"/>
  <!-- the code -->
  <rect x="268" y="58" width="184" height="184" rx="6" fill="#FFFFFF" stroke="#E2E2E6"/>
  <g fill="#111111">
    <!-- finder patterns -->
    <path d="M282 72 h50 v50 h-50 z M291 81 v32 h32 v-32 z" fill-rule="evenodd"/>
