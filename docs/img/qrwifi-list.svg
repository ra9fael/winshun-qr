<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif">
  <!-- launcher window -->
  <rect x="16" y="16" width="688" height="412" rx="16" fill="#26262E" stroke="#3A3A44"/>
  <!-- search box -->
  <rect x="36" y="34" width="648" height="42" rx="10" fill="#1C1C22"/>
  <circle cx="62" cy="55" r="7" fill="none" stroke="#8A8A96" stroke-width="2"/>
  <line x1="67" y1="60" x2="73" y2="66" stroke="#8A8A96" stroke-width="2" stroke-linecap="round"/>
  <text x="84" y="60" font-size="15" fill="#E8E8EE">qrwifi</text>
  <rect x="130" y="44" width="2" height="22" fill="#5B9DFF"/>
  <!-- row 1: selected, shareable -->
  <rect x="30" y="92" width="660" height="46" rx="10" fill="#3A3A46"/>
  <rect x="30" y="100" width="4" height="30" rx="2" fill="#5B9DFF"/>
  <g stroke="#B9B9C6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 108 a14 14 0 0 1 20 0"/>
    <path d="M47 113 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="119" r="2.6" fill="#B9B9C6"/>
  <text x="92" y="112" font-size="15" font-weight="600" fill="#ECECF2">RFK90</text>
  <text x="92" y="131" font-size="13" fill="#9A9AA8">Wi-Fi · WPA · 已连接 · 含密码 · v3 · M · 43 字节</text>
  <!-- row 2 -->
  <g stroke="#B9B9C6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 160 a14 14 0 0 1 20 0"/>
    <path d="M47 165 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="171" r="2.6" fill="#B9B9C6"/>
  <text x="92" y="164" font-size="15" font-weight="600" fill="#ECECF2">Home-5G</text>
  <text x="92" y="183" font-size="13" fill="#9A9AA8">Wi-Fi · WPA · 含密码 · v3 · M · 46 字节</text>
  <!-- row 3: open network -->
  <g stroke="#B9B9C6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 214 a14 14 0 0 1 20 0"/>
    <path d="M47 219 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="225" r="2.6" fill="#B9B9C6"/>
  <text x="92" y="218" font-size="15" font-weight="600" fill="#ECECF2">Guest</text>
  <text x="92" y="237" font-size="13" fill="#9A9AA8">Wi-Fi · 开放 · 开放网络 · v1 · L · 24 字节</text>
  <!-- row 4: per-user profile, unreadable key -->
  <g stroke="#E8A33D" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 268 a14 14 0 0 1 20 0"/>
    <path d="M47 273 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="279" r="2.6" fill="#E8A33D"/>
  <text x="92" y="272" font-size="15" font-weight="600" fill="#E8A33D">HJJ</text>
  <text x="92" y="291" font-size="13" fill="#9A9AA8">Wi-Fi · WPA · 保存为个人配置，当前上下文读不到密码</text>
  <!-- row 5: 802.1X -->
  <g stroke="#E8A33D" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 322 a14 14 0 0 1 20 0"/>
    <path d="M47 327 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="333" r="2.6" fill="#E8A33D"/>
  <text x="92" y="326" font-size="15" font-weight="600" fill="#E8A33D">Office</text>
  <text x="92" y="345" font-size="13" fill="#9A9AA8">Wi-Fi · 802.1X · 企业网络（802.1X）没有共享密码</text>
  <!-- footer key hints -->
  <line x1="36" y1="368" x2="684" y2="368" stroke="#3A3A44"/>
  <g font-size="12" fill="#C9C9D4">
    <rect x="36" y="382" width="50" height="22" rx="5" fill="#34343E" stroke="#4A4A56"/>
    <text x="61" y="397" text-anchor="middle">Enter</text>
    <text x="94" y="397">复制图片</text>
    <rect x="160" y="382" width="84" height="22" rx="5" fill="#34343E" stroke="#4A4A56"/>
    <text x="202" y="397" text-anchor="middle">Ctrl+Enter</text>
    <text x="252" y="397">预览</text>
    <rect x="296" y="382" width="96" height="22" rx="5" fill="#34343E" stroke="#4A4A56"/>
    <text x="344" y="397" text-anchor="middle">Shift+Enter</text>
    <text x="400" y="397">保存 PNG</text>
    <text x="684" y="397" text-anchor="end" fill="#8A8A96">→ 全部动作</text>
  </g>
  <!-- captions -->
  <circle cx="42" cy="454" r="4" fill="#B9B9C6"/>
  <text x="54" y="459" font-size="13" fill="#8A8A93">可分享的网络：副标题给出认证、密码状态、二维码版本与字节数，Enter 直接复制图片</text>
  <circle cx="42" cy="480" r="4" fill="#E8A33D"/>
  <text x="54" y="485" font-size="13" fill="#8A8A93">读不到密码的网络照常列出并写明原因；三个动作仍在，执行时重读 profile，仍拿不到就如实报错</text>
</svg>
