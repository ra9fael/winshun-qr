<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- launcher window -->
  <rect x="16" y="16" width="688" height="376" rx="16" fill="#26262E" stroke="#3A3A44"/>
  <rect x="36" y="34" width="648" height="42" rx="10" fill="#1C1C22"/>
  <circle cx="62" cy="55" r="7" fill="none" stroke="#8A8A96" stroke-width="2"/>
  <line x1="67" y1="60" x2="73" y2="66" stroke="#8A8A96" stroke-width="2" stroke-linecap="round"/>
  <text x="84" y="60" font-size="15" fill="#E8E8EE">qrwifi</text>
  <!-- row 1 -->
  <g stroke="#B9B9C6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 106 a14 14 0 0 1 20 0"/>
    <path d="M47 111 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="117" r="2.6" fill="#B9B9C6"/>
  <text x="92" y="110" font-size="15" font-weight="600" fill="#ECECF2">RFK90</text>
  <text x="92" y="129" font-size="13" fill="#9A9AA8">Wi-Fi · WPA · 已连接 · 含密码 · v3 · M · 43 字节</text>
  <!-- row 2 -->
  <g stroke="#B9B9C6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 160 a14 14 0 0 1 20 0"/>
    <path d="M47 165 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="171" r="2.6" fill="#B9B9C6"/>
  <text x="92" y="164" font-size="15" font-weight="600" fill="#ECECF2">Home-5G</text>
  <text x="92" y="183" font-size="13" fill="#9A9AA8">Wi-Fi · WPA · 含密码 · v3 · M · 46 字节</text>
  <!-- row 3: per-user network, focused, → opens the action menu -->
  <rect x="30" y="196" width="660" height="46" rx="10" fill="#3A3A46"/>
  <g stroke="#E8A33D" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 214 a14 14 0 0 1 20 0"/>
    <path d="M47 219 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="225" r="2.6" fill="#E8A33D"/>
  <text x="92" y="218" font-size="15" font-weight="600" fill="#E8A33D">HJJ</text>
  <text x="92" y="237" font-size="13" fill="#9A9AA8">Wi-Fi · WPA · 保存为个人配置，当前上下文读不到密码</text>
  <rect x="596" y="206" width="86" height="26" rx="6" fill="#34343E" stroke="#4A4A56"/>
  <text x="639" y="223" font-size="12" fill="#C9C9D4" text-anchor="middle">→ 动作菜单</text>
  <!-- row 4: 802.1X -->
  <g stroke="#E8A33D" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 268 a14 14 0 0 1 20 0"/>
    <path d="M47 273 a21 21 0 0 1 30 0"/>
  </g>
  <circle cx="62" cy="279" r="2.6" fill="#E8A33D"/>
  <text x="92" y="272" font-size="15" font-weight="600" fill="#E8A33D">Office</text>
  <text x="92" y="291" font-size="13" fill="#9A9AA8">Wi-Fi · 802.1X · 企业网络（802.1X）没有共享密码</text>
  <!-- footer -->
  <line x1="36" y1="314" x2="684" y2="314" stroke="#3A3A44"/>
  <g font-size="12" fill="#C9C9D4">
    <rect x="36" y="328" width="50" height="22" rx="5" fill="#34343E" stroke="#4A4A56"/>
    <text x="61" y="343" text-anchor="middle">Enter</text>
    <text x="94" y="343">复制图片</text>
    <rect x="160" y="328" width="84" height="22" rx="5" fill="#34343E" stroke="#4A4A56"/>
    <text x="202" y="343" text-anchor="middle">Ctrl+Enter</text>
    <text x="252" y="343">预览</text>
    <rect x="296" y="328" width="96" height="22" rx="5" fill="#34343E" stroke="#4A4A56"/>
    <text x="344" y="343" text-anchor="middle">Shift+Enter</text>
    <text x="400" y="343">保存 PNG</text>
  </g>
  <!-- action menu (right arrow), overlaying the window -->
  <rect x="396" y="180" width="296" height="262" rx="12" fill="#30303A" stroke="#464650" filter="url(#shadow)"/>
  <rect x="404" y="190" width="280" height="40" rx="8" fill="#3F3F4A"/>
  <g font-size="14" fill="#ECECF2">
    <circle cx="422" cy="210" r="3" fill="#5B9DFF"/>
    <text x="436" y="215">复制图片</text>
    <text x="682" y="215" text-anchor="end" font-size="12" fill="#8A8A96">Enter</text>
    <circle cx="422" cy="254" r="3" fill="#5B9DFF"/>
    <text x="436" y="259">预览</text>
    <text x="682" y="259" text-anchor="end" font-size="12" fill="#8A8A96">Ctrl+Enter</text>
    <circle cx="422" cy="298" r="3" fill="#5B9DFF"/>
    <text x="436" y="303">保存 PNG</text>
    <text x="682" y="303" text-anchor="end" font-size="12" fill="#8A8A96">Shift+Enter</text>
  </g>
  <line x1="412" y1="328" x2="676" y2="328" stroke="#464650"/>
  <g font-size="14" fill="#ECECF2">
    <circle cx="422" cy="352" r="3" fill="#8A8A96"/>
    <text x="436" y="357">复制</text>
    <text x="682" y="357" text-anchor="end" font-size="12" fill="#8A8A96">Ctrl+C</text>
    <circle cx="422" cy="396" r="3" fill="#8A8A96"/>
    <text x="436" y="401">复制名称</text>
  </g>
  <!-- captions -->
  <text x="16" y="472" font-size="13" fill="#8A8A93">→ 打开动作菜单：插件命名的三个动作照常列出，即使这一行读不到密码 —— 执行时重读 profile，</text>
  <text x="16" y="492" font-size="13" fill="#8A8A93">成功就生成，失败则写明原因；802.1X 没有可共享的密码，也没有动作，菜单只剩复制两项。</text>
</svg>
